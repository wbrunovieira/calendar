name: CD

# Deploy contínuo → VPS Contabo via SSH direto, como o usuário NÃO-root `deploy`
# (chave dedicada; membro do grupo docker, sem sudo).
#
# Gates de segurança (espelhado do WB-crm):
#   1. Só dispara quando o workflow CI termina VERDE na main (nunca em PR).
#   2. Environment `production` exige APROVAÇÃO MANUAL (required reviewer).
#   3. Host key do VPS pinada em deploy/ci/known_hosts (sem TOFU/keyscan em runtime).
#   4. Só rebuilda os serviços cujo código mudou desde o último deploy BEM-SUCEDIDO,
#      lido do marcador /opt/calendar/.deployed-sha (deploy/ci/changed-services.sh).
#      O deploy opera no SHA ALVO (o head do CI que disparou) ponta a ponta: o servidor faz
#      checkout desse SHA e o marcador grava esse SHA. Runs obsoletos (main já avançou) são
#      pulados — isso evita a corrupção do marcador (#521). Marcador ausente → rebuilda todos.
#   5. Migrations: se o diff tocar services/calendar-core/prisma/migrations/,
#      roda `prisma migrate deploy` logo após subir o calendar-core.
#
# O build roda DETACHED no servidor (nohup + poll) — build longo não cai com o SSH.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Serviços a deployar (ex: 'calendar-finances agents'), 'auto' detecta pelo diff, 'all' rebuilda todos"
        type: string
        default: auto

permissions:
  contents: read

# Um deploy por vez; nunca cancela um deploy em andamento.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → VPS Contabo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # workflow_run: só se o CI concluiu com sucesso. workflow_dispatch: sempre permite
    # (o environment ainda exige aprovação manual).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://calendar.wbdigitalsolutions.com
    env:
      VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SSH_OPTS: -n -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o LogLevel=ERROR
    steps:
      - uses: actions/checkout@v5
        with:
          # Fixa o checkout no SHA que disparou o run (head do CI), não no tip atual da main —
          # senão o diff/marcador fica inconsistente quando a main avança durante o gate de aprovação.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # histórico completo p/ diff contra o SHA deployado

      # ssh-agent manual (sem action de terceiro tocando a chave privada)
      - name: Start ssh-agent with deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$SSH_DEPLOY_KEY"

      - name: Pin VPS host key (no TOFU)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          grep -v '^#' deploy/ci/known_hosts > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Alvo do deploy = o SHA que disparou este run. Se a main já avançou além dele (run que ficou
      # parado no gate de aprovação e foi aprovado tarde), este run é OBSOLETO: pula tudo, porque um
      # run mais novo vai deployar o tip. Isso evita que um run velho puxe a main pra frente e grave
      # o marcador num SHA que ele não buildou (bug do marcador, issue #521).
      - name: Alvo do deploy + pular runs obsoletos
        id: target
        run: |
          TARGET="$(git rev-parse HEAD)"
          MAIN_TIP="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Alvo: $TARGET | tip de origin/main: ${MAIN_TIP:-<não resolveu>} | evento: ${{ github.event_name }}"
          # Só marca obsoleto se o tip resolveu de fato (ls-remote pode falhar por rede). Não conseguir
          # resolver → NÃO pular (deployar o alvo é mais seguro que pular silenciosamente).
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -n "$MAIN_TIP" ] && [ "$TARGET" != "$MAIN_TIP" ]; then
            echo "::warning::Run obsoleto — alvo $TARGET não é mais o tip de main ($MAIN_TIP). Pulando; um run mais novo faz o deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed services + pending migrations
        id: detect
        if: steps.target.outputs.stale != 'true'
        env:
          # Via env (não `${{ }}` direto no script) pra não permitir injeção de shell pelo input.
          SERVICES_INPUT: ${{ inputs.services || 'auto' }}
        run: |
          # Valida o override manual contra uma allowlist antes de repassar.
          ALLOWED="calendar-core calendar-finances calendar-health agents calendar-frontend finances-frontend health-frontend"
          if [ "$SERVICES_INPUT" != "auto" ] && [ "$SERVICES_INPUT" != "all" ]; then
            for s in $SERVICES_INPUT; do
              case " $ALLOWED " in
                *" $s "*) ;;
                *) echo "::error::Serviço inválido no input 'services': '$s'"; exit 1 ;;
              esac
            done
          fi
          # SHA do último deploy BEM-SUCEDIDO, do marcador. O diff é marcador..HEAD, e HEAD está
          # fixado no SHA alvo (checkout ref acima). Marcador ausente (1ª vez) → rebuilda todos.
          DEPLOYED=$(ssh $SSH_OPTS "$VPS" 'cat /opt/calendar/.deployed-sha 2>/dev/null' || true)
          echo "SHA do último deploy bem-sucedido (marcador): ${DEPLOYED:-desconhecido}"
          bash deploy/ci/changed-services.sh "$DEPLOYED" "$SERVICES_INPUT" >> "$GITHUB_OUTPUT"

      - name: Sync código no servidor (checkout do SHA alvo)
        if: steps.target.outputs.stale != 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          # Checkout do SHA exato (não `git pull origin main`), pra deployar precisamente o alvo e
          # não o tip da main, que pode ter avançado. `.env`/`.deployed-sha` são gitignored → seguros.
          ssh $SSH_OPTS "$VPS" "cd /opt/calendar && git fetch --quiet origin && git checkout --force $TARGET && git rev-parse HEAD"

      - name: Build (detached no servidor, poll até terminar)
        if: steps.detect.outputs.services != ''
        env:
          SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          echo "Serviços: $SERVICES"
          PID=$(ssh $SSH_OPTS "$VPS" "cd /opt/calendar && nohup docker-compose -f docker-compose.prod.yml build $SERVICES > /tmp/cd-build.log 2>&1 & echo \$!")
          echo "Build PID no servidor: $PID"
          for i in $(seq 1 120); do
            if ! ssh $SSH_OPTS "$VPS" "kill -0 $PID 2>/dev/null"; then
              break
            fi
            sleep 15
          done
          if ssh $SSH_OPTS "$VPS" "kill -0 $PID 2>/dev/null"; then
            echo "::error::Build ainda rodando após 30min"; exit 1
          fi
          ssh $SSH_OPTS "$VPS" "tail -5 /tmp/cd-build.log"
          # docker-compose build retorna via log; erro real aparece como 'ERROR' no fim
          if ssh $SSH_OPTS "$VPS" "grep -qiE '^ERROR|failed to solve|error during build' /tmp/cd-build.log"; then
            echo "::error::Build falhou no servidor"; ssh $SSH_OPTS "$VPS" "tail -40 /tmp/cd-build.log"; exit 1
          fi

      - name: Subir serviços (up -d)
        if: steps.detect.outputs.services != ''
        env:
          SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          ssh $SSH_OPTS "$VPS" "cd /opt/calendar && docker-compose -f docker-compose.prod.yml up -d $SERVICES"

      # Mudança no docker-compose.prod.yml (limites de memória, env, portas):
      # `up -d` apenas nos serviços RODANDO — o compose recria só os que mudaram
      # e serviços parados de propósito (ex. Langfuse) não são acordados.
      - name: Aplicar mudanças de infra do compose (up -d nos rodando)
        if: steps.detect.outputs.infra == 'true'
        run: |
          ssh $SSH_OPTS "$VPS" 'cd /opt/calendar && RUNNING=$(docker-compose -f docker-compose.prod.yml ps --services --status running | tr "\n" " ") && echo "Rodando: $RUNNING" && docker-compose -f docker-compose.prod.yml up -d $RUNNING'

      # A config do Authelia e um bind mount: o container so a le ao iniciar.
      # Trocar o arquivo sem reiniciar deixa a politica antiga valendo.
      - name: Aplicar politica do gateway (Authelia)
        if: steps.detect.outputs.gateway == 'true'
        run: |
          ssh $SSH_OPTS "$VPS" 'cd /opt/calendar && docker-compose -f docker-compose.prod.yml restart authelia'
          sleep 10
          # Verificar o EFEITO, nao o status do comando. Um dominio de API que
          # responde 200 a uma requisicao anonima esta aberto para a internet,
          # tenha o restart "dado certo" ou nao.
          ssh $SSH_OPTS "$VPS" 'FAIL=0
            for d in calendar-finances calendar-health agents; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$d.wbdigitalsolutions.com/")
              echo "$d -> $CODE"
              case "$CODE" in
                200) echo "::error::$d responde 200 sem sessao — o gateway nao esta protegendo"; FAIL=1 ;;
              esac
            done; exit $FAIL'

      - name: Prisma migrate deploy (calendar-core)
        if: steps.detect.outputs.migrate == 'true'
        run: |
          ssh $SSH_OPTS "$VPS" "cd /opt/calendar && docker-compose -f docker-compose.prod.yml exec -T calendar-core npx prisma migrate deploy"

      - name: Health check
        if: steps.target.outputs.stale != 'true'
        run: |
          sleep 15
          ssh $SSH_OPTS "$VPS" 'FAIL=0; for u in 3334/ 3335/health 3336/api/v1/health 3337/health 3001/ 3003/ 3004/; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:$u)
            echo "porta $u -> $CODE"
            case "${u%%/*}" in
              3334) [ "$CODE" = "404" ] || [ "$CODE" = "200" ] || FAIL=1 ;; # core não tem rota / (404 = vivo)
              *)    [ "$CODE" = "200" ] || [ "$CODE" = "307" ] || FAIL=1 ;;
            esac
          done; exit $FAIL'

      # Só chega aqui se build + up + migrate + health passaram (steps sem `if` param no 1º erro).
      # Grava o SHA ALVO deployado (não o HEAD do servidor) — é ele que a detecção compara no
      # próximo deploy. Gravar o alvo, e não o tip da main, é o que corrige o bug do marcador (#521).
      - name: Registrar SHA deployado (marcador)
        if: steps.target.outputs.stale != 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          ssh $SSH_OPTS "$VPS" "cd /opt/calendar && printf '%s\n' '$TARGET' > .deployed-sha && echo \"marcador: \$(cat .deployed-sha)\""

      - name: Cleanup (prune de imagens antigas)
        if: always() && steps.detect.outputs.services != ''
        run: |
          ssh $SSH_OPTS "$VPS" "docker image prune -f && docker builder prune -f --keep-storage 5GB" || true
