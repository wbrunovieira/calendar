name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-calendar-core:
    name: Calendar Core Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar123
          POSTGRES_DB: calendar_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/calendar-core/package-lock.json

      - name: Install dependencies
        working-directory: services/calendar-core
        run: npm ci

      - name: Run Prisma migrations
        working-directory: services/calendar-core
        env:
          DATABASE_URL: postgresql://calendar:calendar123@localhost:5433/calendar_test_db
        run: npx prisma migrate deploy

      - name: Run unit tests
        working-directory: services/calendar-core
        env:
          DATABASE_URL: postgresql://calendar:calendar123@localhost:5433/calendar_test_db
          NODE_ENV: test
          TZ: America/Sao_Paulo
        run: npm run test:cov

      - name: Run E2E tests
        working-directory: services/calendar-core
        env:
          DATABASE_URL: postgresql://calendar:calendar123@localhost:5433/calendar_test_db
          NODE_ENV: test
          TZ: America/Sao_Paulo
        run: npm run test:e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./services/calendar-core/coverage/coverage-final.json
          flags: calendar-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-calendar-finances:
    name: Calendar Finances Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar123
          POSTGRES_DB: calendar_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/calendar-finances/go.sum

      - name: Install dependencies
        working-directory: services/calendar-finances
        run: go mod download

      - name: Run tests with coverage
        working-directory: services/calendar-finances
        env:
          DATABASE_URL: postgres://calendar:calendar123@localhost:5433/calendar_test_db?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./services/calendar-finances/coverage.out
          flags: calendar-finances
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint-calendar-core:
    name: Calendar Core Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/calendar-core/package-lock.json

      - name: Install dependencies
        working-directory: services/calendar-core
        run: npm ci

      - name: Run linter
        working-directory: services/calendar-core
        run: npm run lint

      - name: Check formatting
        working-directory: services/calendar-core
        run: npm run format -- --check
