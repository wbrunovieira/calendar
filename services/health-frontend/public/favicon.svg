<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGradient)"/>

  <!-- Dumbbell icon -->
  <!-- Left weight -->
  <rect x="12" y="24" width="8" height="16" rx="2" fill="white"/>
  <rect x="14" y="20" width="4" height="24" rx="1" fill="white"/>

  <!-- Bar -->
  <rect x="18" y="30" width="28" height="4" rx="1" fill="white"/>

  <!-- Right weight -->
  <rect x="44" y="24" width="8" height="16" rx="2" fill="white"/>
  <rect x="46" y="20" width="4" height="24" rx="1" fill="white"/>
</svg>
