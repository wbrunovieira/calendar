  <!-- Calendar grid dots -->
  <circle cx="10" cy="17" r="1" fill="#350545"/>
  <circle cx="16" cy="17" r="1" fill="#350545"/>
  <circle cx="22" cy="17" r="1" fill="#350545"/>

  <circle cx="10" cy="21" r="1" fill="#350545"/>
  <circle cx="16" cy="21" r="1" fill="#350545"/>
