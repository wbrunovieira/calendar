services:
  calendar-core:
    build:
      context: ./services/calendar-core
      dockerfile: Dockerfile.dev
    container_name: calendar-core
    ports:
      - "3334:3334"
    volumes:
      - ./services/calendar-core:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://calendar:calendar123@postgres:5432/calendar_db
      - PORT=3334
      - TZ=America/Sao_Paulo
    depends_on:
      - postgres
    networks:
      - calendar-network
    command: npm run start:dev

  calendar-finances:
    build:
      context: ./services/calendar-finances
      dockerfile: Dockerfile
    container_name: calendar-finances
    ports:
      - "3335:3335"
    environment:
      - PORT=3335
      - DATABASE_URL=postgres://calendar:calendar123@postgres:5432/calendar_db?sslmode=disable
    depends_on:
      - postgres
    networks:
      - calendar-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: calendar-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=calendar
      - POSTGRES_PASSWORD=calendar123
      - POSTGRES_DB=calendar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - calendar-network

volumes:
  postgres_data:

networks:
  calendar-network:
    driver: bridge