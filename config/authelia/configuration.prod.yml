---
theme: light

server:
  address: 'tcp://0.0.0.0:9091'
  asset_path: /config/assets

log:
  level: info

totp:
  disable: false
  issuer: WB Digital

webauthn:
  disable: true

duo_api:
  disable: true

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: bcrypt
      bcrypt:
        cost: 12

access_control:
  default_policy: one_factor
  rules:
    - domain: 'auth.wbdigitalsolutions.com'
      policy: bypass
    # calendar-core carries its own bearer token and is called server-to-server
    # by n8n and the agents, which have no browser session. It stays open here
    # because its own gate is the one that matters.
    - domain: 'calendar-api.wbdigitalsolutions.com'
      policy: bypass
    # These three had no authentication of any kind, and bypassing the gateway
    # left them answering the public internet. Verified from outside the server,
    # with no credentials: calendar-finances returned account balances on a GET
    # and reached field validation on a POST (400, not 401 — nothing guards the
    # write path); calendar-health served profiles; agents reached FastAPI
    # validation on a POST (422) and published /docs, and its endpoints spend
    # money on LLM calls.
    #
    # Nothing on the server calls them over the public domain — the dashboards
    # now send the Authelia session cookie, and service-to-service traffic goes
    # over the Docker network.
    - domain:
        - 'calendar-finances.wbdigitalsolutions.com'
        - 'calendar-health.wbdigitalsolutions.com'
        - 'agents.wbdigitalsolutions.com'
      policy: one_factor
    - domain:
        - 'calendar.wbdigitalsolutions.com'
        - 'finances.wbdigitalsolutions.com'
        - 'health.wbdigitalsolutions.com'
        - 'calendar-langfuse.wbdigitalsolutions.com'
        - 'projects.wbdigitalsolutions.com'
      policy: one_factor

session:
  name: authelia_session
  cookies:
    - domain: 'wbdigitalsolutions.com'
      authelia_url: 'https://auth.wbdigitalsolutions.com'
      default_redirection_url: 'https://calendar.wbdigitalsolutions.com'
      expiration: 12h
      inactivity: 4h
      remember_me: 30d

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m
