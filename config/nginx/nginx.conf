worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # SSL shared settings
    ssl_certificate /etc/nginx/certs/app.localhost+1.pem;
    ssl_certificate_key /etc/nginx/certs/app.localhost+1-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # ── HTTP → HTTPS redirect ────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Authelia Portal ──────────────────────────────────
    server {
        listen 443 ssl;
        server_name auth.app.localhost;

        location / {
            proxy_pass http://authelia:9091;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Calendar Frontend (host:3000) ────────────────────
    server {
        listen 443 ssl;
        server_name calendar.app.localhost;

        include /etc/nginx/snippets/authelia-location.conf;

        location / {
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://host.docker.internal:3000;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Finances Frontend (host:3003) ────────────────────
    server {
        listen 443 ssl;
        server_name finances.app.localhost;

        include /etc/nginx/snippets/authelia-location.conf;

        location / {
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://host.docker.internal:3003;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Health Frontend (host:3004) ──────────────────────
    server {
        listen 443 ssl;
        server_name health.app.localhost;

        include /etc/nginx/snippets/authelia-location.conf;

        location / {
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://host.docker.internal:3004;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Calendar API (Docker:3334) ───────────────────────
    server {
        listen 443 ssl;
        server_name calendar-api.app.localhost;

        location / {
            proxy_pass http://calendar-core:3334;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Finances API (Docker:3335) ───────────────────────
    server {
        listen 443 ssl;
        server_name finances-api.app.localhost;

        location / {
            proxy_pass http://calendar-finances:3335;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Health API (Docker:3336) ─────────────────────────
    server {
        listen 443 ssl;
        server_name health-api.app.localhost;

        location / {
            proxy_pass http://calendar-health:3336;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Agents API (Docker:3337) ─────────────────────────
    server {
        listen 443 ssl;
        server_name agents-api.app.localhost;

        location / {
            proxy_pass http://calendar-agents:3337;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }

    # ── Langfuse UI (Docker:3000 inside container) ───────
    server {
        listen 443 ssl;
        server_name langfuse.app.localhost;

        include /etc/nginx/snippets/authelia-location.conf;

        location / {
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://langfuse-web:3000;
            include /etc/nginx/snippets/proxy-params.conf;
        }
    }
}
