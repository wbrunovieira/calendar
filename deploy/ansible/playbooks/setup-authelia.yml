---
# Setup Authelia auth gateway in production
# Usage: ansible-playbook playbooks/setup-authelia.yml
# Prerequisites: DNS A record for auth.wbdigitalsolutions.com → 45.90.123.190
- name: Setup Authelia Auth Gateway
  hosts: calendar_server
  gather_facts: false

  tasks:
    # ── Pull latest code ─────────────────────────────────────
    - name: Pull latest code
      raw: cd {{ app_dir }} && git pull origin {{ git_branch }} 2>&1
      register: git_result

    - name: Show git changes
      raw: echo "{{ git_result.stdout_lines | default(['no output']) | join('\n') }}"
      changed_when: false

    # ── Generate AUTHELIA secrets ────────────────────────────
    - name: Check if AUTHELIA secrets already in .env
      raw: grep -c 'AUTHELIA_JWT_SECRET' {{ app_dir }}/.env 2>/dev/null || echo "0"
      register: authelia_env_check
      changed_when: false

    - name: Generate and append AUTHELIA secrets to .env
      raw: |
        JWT=$(openssl rand -hex 32)
        SESSION=$(openssl rand -hex 32)
        STORAGE=$(openssl rand -hex 32)
        cat >> {{ app_dir }}/.env << EOF

        # Authelia
        AUTHELIA_JWT_SECRET=${JWT}
        AUTHELIA_SESSION_SECRET=${SESSION}
        AUTHELIA_STORAGE_ENCRYPTION_KEY=${STORAGE}
        EOF
        echo "AUTHELIA secrets added to .env"
      when: "'0' in authelia_env_check.stdout"

    # ── Create users_database.yml on server ──────────────────
    - name: Create Authelia users database
      raw: |
        cat > {{ app_dir }}/config/authelia/users_database.yml << 'EOF'
        ---
        users:
          bruno:
            disabled: false
            displayname: "Bruno Vieira"
            password: "$2b$12$TyM6.GBFQO0gxANlmldmTOLUW2YXTA8wG24tTwZ/AdFOHkG4GFS7G"
            email: wbrunovieira77@gmail.com
            groups:
              - admins
        EOF

    - name: Ensure authelia assets directory exists
      raw: mkdir -p {{ app_dir }}/config/authelia/assets
      changed_when: false

    # ── Start Authelia container ─────────────────────────────
    - name: Start authelia container
      raw: |
        cd {{ app_dir }} && docker compose -f {{ compose_file }} up -d authelia 2>&1
      register: authelia_start

    - name: Show authelia start output
      raw: echo "{{ (authelia_start.stdout_lines | default(['no output']))[-10:] | join('\n') }}"
      changed_when: false

    - name: Wait for Authelia to be ready
      raw: |
        for i in $(seq 1 15); do
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:9092/api/health 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Authelia is ready (attempt $i)"
            exit 0
          fi
          echo "Waiting for Authelia... attempt $i ($STATUS)"
          sleep 2
        done
        echo "WARNING: Authelia may not be ready yet"
      changed_when: false

    # ── Create Nginx snippets (production) ───────────────────
    - name: Ensure snippets directory exists
      raw: mkdir -p /etc/nginx/snippets
      changed_when: false

    - name: Create authelia-location snippet
      raw: |
        cat > /etc/nginx/snippets/authelia-location.conf << 'EOF'
        location /authelia {
            internal;
            proxy_pass http://127.0.0.1:9092/api/authz/auth-request;

            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";

            proxy_pass_request_body off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
        EOF

    - name: Create authelia-authrequest snippet
      raw: |
        cat > /etc/nginx/snippets/authelia-authrequest.conf << 'EOF'
        auth_request /authelia;
        auth_request_set $target_url $scheme://$http_host$request_uri;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;

        error_page 401 =302 https://auth.wbdigitalsolutions.com/?rd=$target_url;

        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
        EOF

    # ── API variant of the auth-request snippet ──────────────
    # A browser calling the API from a sibling subdomain cannot follow a
    # redirect to the login page. The cross-origin 302 carries no CORS headers,
    # so fetch rejects with "TypeError: Failed to fetch" and the caller never
    # learns that the session is what expired — every screen reports an empty
    # account instead. The preflight is redirected too, and a redirected
    # preflight is refused outright, so the real request is never even sent.
    #
    # The API therefore answers an expired session with a real 401 the browser
    # is allowed to read, and answers the preflight before the access phase.
    # Pages keep the 302: a human typing a URL should land on the login form.
    - name: Create cross-origin map for the API vhosts
      raw: |
        cat > /etc/nginx/conf.d/cors-origin.conf << 'EOF'
        # Echo back only the origins we actually serve. A credentialed request
        # may not be answered with "*", and an unlisted origin yields an empty
        # value, which nginx omits rather than emitting a blank header.
        map $http_origin $cors_origin {
            default                                     "";
            "https://finances.wbdigitalsolutions.com"   $http_origin;
            "https://health.wbdigitalsolutions.com"     $http_origin;
            "https://calendar.wbdigitalsolutions.com"   $http_origin;
        }
        EOF

    - name: Create authelia-authrequest-api snippet
      raw: |
        cat > /etc/nginx/snippets/authelia-authrequest-api.conf << 'EOF'
        # The preflight carries no cookies and discloses nothing, and it is
        # evaluated in the rewrite phase — before auth_request runs — which is
        # exactly what keeps the real request from being blocked behind it.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true         always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age           86400        always;
            return 204;
        }

        auth_request /authelia;
        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        # A readable 401 instead of a redirect the browser has to throw away.
        error_page 401 = @authelia_api_401;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;
        EOF

    - name: Create authelia-api-401 snippet
      raw: |
        cat > /etc/nginx/snippets/authelia-api-401.conf << 'EOF'
        # `always` matters: without it nginx attaches these only to 2xx/3xx, and
        # a 401 the browser cannot read is the bug this whole change exists to
        # remove. The body names the login portal so the caller never has to
        # hardcode it.
        location @authelia_api_401 {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true         always;
            default_type application/json;
            return 401 '{"error":"unauthenticated","login":"https://auth.wbdigitalsolutions.com/"}';
        }
        EOF

    # ── Backup existing Nginx configs ────────────────────────
    - name: Backup existing frontend Nginx configs
      raw: |
        BACKUP_DIR="/etc/nginx/backups/$(date +%Y%m%d_%H%M%S)"
        mkdir -p $BACKUP_DIR
        for conf in calendar finances health calendar-langfuse; do
          FILE="/etc/nginx/sites-available/${conf}.wbdigitalsolutions.com.conf"
          [ -f "$FILE" ] && cp "$FILE" "$BACKUP_DIR/"
        done
        # The API vhosts are certbot-managed regular files in sites-enabled,
        # not symlinks into sites-available. Back up where they actually live.
        for conf in calendar-finances calendar-health agents calendar-agents; do
          FILE="/etc/nginx/sites-enabled/${conf}.wbdigitalsolutions.com.conf"
          [ -f "$FILE" ] && cp "$FILE" "$BACKUP_DIR/"
        done
        echo "Backed up to $BACKUP_DIR"
      changed_when: false

    # ── Create auth.wbdigitalsolutions.com Nginx config ──────
    - name: Create auth portal Nginx config (HTTP for certbot)
      raw: |
        cat > /etc/nginx/sites-available/auth.wbdigitalsolutions.com.conf << 'CONFEOF'
        server {
            listen 80;
            server_name auth.wbdigitalsolutions.com;

            location / {
                proxy_pass http://127.0.0.1:9092;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        CONFEOF

    - name: Enable auth portal site
      raw: ln -sf /etc/nginx/sites-available/auth.wbdigitalsolutions.com.conf /etc/nginx/sites-enabled/

    # ── Update protected frontend configs (with auth) ────────

    - name: Update calendar frontend config (with auth)
      raw: |
        cat > /etc/nginx/sites-available/calendar.wbdigitalsolutions.com.conf << 'CONFEOF'
        server {
            listen 80;
            server_name calendar.wbdigitalsolutions.com;
            return 301 https://$host$request_uri;
        }
        server {
            listen 443 ssl;
            server_name calendar.wbdigitalsolutions.com;

            ssl_certificate /etc/letsencrypt/live/calendar.wbdigitalsolutions.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/calendar.wbdigitalsolutions.com/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            include /etc/nginx/snippets/authelia-location.conf;

            location / {
                include /etc/nginx/snippets/authelia-authrequest.conf;
                proxy_pass http://127.0.0.1:3001;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        CONFEOF

    - name: Update finances frontend config (with auth)
      raw: |
        cat > /etc/nginx/sites-available/finances.wbdigitalsolutions.com.conf << 'CONFEOF'
        server {
            listen 80;
            server_name finances.wbdigitalsolutions.com;
            return 301 https://$host$request_uri;
        }
        server {
            listen 443 ssl;
            server_name finances.wbdigitalsolutions.com;

            ssl_certificate /etc/letsencrypt/live/finances.wbdigitalsolutions.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/finances.wbdigitalsolutions.com/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            include /etc/nginx/snippets/authelia-location.conf;

            location / {
                include /etc/nginx/snippets/authelia-authrequest.conf;
                proxy_pass http://127.0.0.1:3003;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        CONFEOF

    - name: Update health frontend config (with auth)
      raw: |
        cat > /etc/nginx/sites-available/health.wbdigitalsolutions.com.conf << 'CONFEOF'
        server {
            listen 80;
            server_name health.wbdigitalsolutions.com;
            return 301 https://$host$request_uri;
        }
        server {
            listen 443 ssl;
            server_name health.wbdigitalsolutions.com;

            ssl_certificate /etc/letsencrypt/live/health.wbdigitalsolutions.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/health.wbdigitalsolutions.com/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            include /etc/nginx/snippets/authelia-location.conf;

            location / {
                include /etc/nginx/snippets/authelia-authrequest.conf;
                proxy_pass http://127.0.0.1:3004;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        CONFEOF

    - name: Update Langfuse config (with auth)
      raw: |
        cat > /etc/nginx/sites-available/calendar-langfuse.wbdigitalsolutions.com.conf << 'CONFEOF'
        server {
            listen 80;
            server_name calendar-langfuse.wbdigitalsolutions.com;
            return 301 https://$host$request_uri;
        }
        server {
            listen 443 ssl;
            server_name calendar-langfuse.wbdigitalsolutions.com;

            ssl_certificate /etc/letsencrypt/live/calendar-langfuse.wbdigitalsolutions.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/calendar-langfuse.wbdigitalsolutions.com/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            include /etc/nginx/snippets/authelia-location.conf;

            # Langfuse SDK API — bypass auth (authenticated via API keys)
            location /api/public/ {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                include /etc/nginx/snippets/authelia-authrequest.conf;
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        CONFEOF

    # ── Test and reload Nginx ────────────────────────────────
    - name: Test Nginx configuration
      raw: nginx -t 2>&1
      register: nginx_test

    - name: Show Nginx test result
      raw: "echo '{{ nginx_test.stdout | default('') }}{{ nginx_test.stderr | default('') }}'"
      changed_when: false

    - name: Reload Nginx
      raw: systemctl reload nginx

    # ── SSL cert for auth subdomain ──────────────────────────
    - name: Check DNS for auth.wbdigitalsolutions.com
      raw: |
        RESOLVED=$(dig +short auth.wbdigitalsolutions.com A 2>/dev/null || echo "UNRESOLVED")
        echo "auth.wbdigitalsolutions.com → ${RESOLVED:-UNRESOLVED}"
      changed_when: false

    - name: Obtain SSL cert for auth.wbdigitalsolutions.com
      raw: |
        certbot --nginx -d auth.wbdigitalsolutions.com --non-interactive --agree-tos -m {{ certbot_email }} 2>&1
      register: cert_auth
      ignore_errors: true

    - name: Show SSL cert result
      raw: echo "{{ cert_auth.stdout_lines | default(['no output']) | join('\n') }}"
      changed_when: false

    - name: Reload Nginx after SSL
      raw: systemctl reload nginx
      ignore_errors: true


    # ── Protect the API vhosts ───────────────────────────────
    # These three answered the public internet with no authentication of any
    # kind: calendar-finances served balances on a GET and reached field
    # validation on a POST, so nothing guarded the write path either.
    #
    # PR #32 added them to Authelia's access_control, but the policy alone does
    # nothing — nginx has to call the gateway. That half was missing, and the
    # domains stayed open while the config said they were protected.
    #
    # These files are certbot-managed and use cert paths that differ from the
    # frontends, so this INSERTS the includes instead of rewriting the file.
    # Re-running is safe: a vhost that already includes the snippet is skipped.
    - name: Wire the API vhosts to the API auth snippets
      raw: |
        python3 - <<'PYEOF'
        import os, re
        SITES = ["calendar-finances", "calendar-health", "agents"]
        LOC  = "    include /etc/nginx/snippets/authelia-location.conf;"
        E401 = "    include /etc/nginx/snippets/authelia-api-401.conf;"
        REQ  = "        include /etc/nginx/snippets/authelia-authrequest-api.conf;"
        GENERIC = "authelia-authrequest.conf"

        for name in SITES:
            p = "/etc/nginx/sites-enabled/%s.wbdigitalsolutions.com.conf" % name
            if not os.path.exists(p):
                print("SKIP (missing): %s" % name); continue
            src = open(p).read()
            before = src

            # A vhost wired by the earlier revision of this playbook carries the
            # page snippet, whose error_page turns 401 into a cross-origin 302 the
            # browser cannot read. Swap it rather than skipping: the vhosts that
            # most need this fix are exactly the ones already protected.
            src = src.replace(GENERIC, "authelia-authrequest-api.conf")

            lines, out = src.split("\n"), []
            has_loc  = "authelia-location.conf" in src
            has_401  = "authelia-api-401.conf" in src
            has_req  = "authelia-authrequest-api.conf" in src
            did_loc = did_req = False
            for line in lines:
                out.append(line)
                if not did_loc and re.match(r"\s*server_name\s", line):
                    if not has_loc: out.append(""); out.append(LOC)
                    if not has_401: out.append(E401)
                    did_loc = True
                elif not did_req and not has_req and re.match(r"\s*location\s+/\s*\{", line):
                    out.append(REQ); did_req = True
            src = "\n".join(out)

            if src == before:
                print("OK (already current): %s" % name); continue
            if "authelia-authrequest-api.conf" not in src or "authelia-api-401.conf" not in src:
                raise SystemExit("ERROR: anchors not found in %s" % name)
            open(p, "w").write(src)
            print("WIRED: %s" % name)
        PYEOF

    # calendar-agents is a second vhost onto the same agents container, and n8n
    # calls it server-to-server with no browser session — Authelia would kill the
    # WhatsApp pipeline. Its /agents/* routes stay reachable; the API map does
    # not need to be, and it was public.
    - name: Block the API map on calendar-agents
      raw: |
        python3 - <<'PYEOF'
        import os
        p = "/etc/nginx/sites-enabled/calendar-agents.wbdigitalsolutions.com.conf"
        if not os.path.exists(p):
            print("SKIP (missing): calendar-agents")
        else:
            s = open(p).read()
            if "openapi" in s:
                print("SKIP (already blocked): calendar-agents")
            else:
                block = (
                    "\n    # n8n only calls /agents/*. The API map is not needed by any\n"
                    "    # consumer and was reachable anonymously from the internet.\n"
                    "    location ~ ^/(docs|redoc|openapi\\.json)$ {\n"
                    "        return 404;\n"
                    "    }\n"
                )
                i = s.index("location / {")
                s = s[:i].rstrip("\n") + "\n" + block + "\n    " + s[i:]
                open(p, "w").write(s)
                print("BLOCKED: calendar-agents /docs /redoc /openapi.json")
        PYEOF

    # ── Test and reload after rewiring the API vhosts ────
    # The earlier nginx -t ran before these files were touched, so without this
    # the run would reload the old config and then "verify" it - a check that
    # passes by testing the thing it was supposed to change.
    - name: Test Nginx after wiring the API vhosts
      raw: nginx -t 2>&1
      register: nginx_test_api
      ignore_errors: true

    - name: Restore the backed-up vhosts if the config is broken
      raw: |
        BACKUP_DIR=$(ls -1d /etc/nginx/backups/*/ 2>/dev/null | tail -1)
        echo "RESTORING from $BACKUP_DIR"
        for conf in calendar-finances calendar-health agents calendar-agents; do
          F="$BACKUP_DIR/${conf}.wbdigitalsolutions.com.conf"
          [ -f "$F" ] && cp "$F" "/etc/nginx/sites-enabled/${conf}.wbdigitalsolutions.com.conf" && echo "  restored $conf"
        done
        rm -f /etc/nginx/snippets/authelia-authrequest-api.conf /etc/nginx/snippets/authelia-api-401.conf /etc/nginx/conf.d/cors-origin.conf
        nginx -t 2>&1
      when: nginx_test_api is failed

    - name: Fail loudly rather than reload a broken gateway
      raw: "echo 'nginx -t failed after wiring the API vhosts; previous config restored' && exit 1"
      when: nginx_test_api is failed

    - name: Reload Nginx after wiring the API vhosts
      raw: systemctl reload nginx

    # ── Final verification ───────────────────────────────────
    - name: Verify Authelia health
      raw: |
        echo "Authelia (direct):  $(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:9092/api/health || echo 'DOWN')"
        echo "Auth portal (HTTPS): $(curl -sf -o /dev/null -w '%{http_code}' -L https://auth.wbdigitalsolutions.com/ || echo 'DOWN')"
      changed_when: false

    - name: Verify protected frontends redirect to login
      raw: |
        for domain in calendar.wbdigitalsolutions.com finances.wbdigitalsolutions.com health.wbdigitalsolutions.com calendar-langfuse.wbdigitalsolutions.com; do
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://$domain/ 2>/dev/null || echo "FAIL")
          echo "  $domain → $STATUS (expect 302)"
        done
      changed_when: false

    # These were listed as "bypass" while they in fact answered anyone. They are
    # protected now, so the expected result is a redirect, not a 200.
    # The APIs now answer a browser, not a human typing a URL: a readable 401
    # instead of a redirect that cross-origin JavaScript has to throw away, and
    # a preflight that is answered rather than redirected. A 302 here means the
    # vhost is still on the page snippet and the dashboards will report empty
    # accounts the next time a session lapses.
    - name: Verify the protected APIs answer a readable 401, not a redirect
      raw: |
        ORIGIN="https://finances.wbdigitalsolutions.com"
        for domain in calendar-finances.wbdigitalsolutions.com calendar-health.wbdigitalsolutions.com agents.wbdigitalsolutions.com; do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Origin: $ORIGIN" https://$domain/api/v1/profiles 2>/dev/null || echo "FAIL")
          ACAO=$(curl -s -D- -o /dev/null --max-time 10 -H "Origin: $ORIGIN" https://$domain/api/v1/profiles 2>/dev/null | grep -ci '^access-control-allow-origin' || true)
          PRE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: content-type' https://$domain/api/v1/profiles 2>/dev/null || echo "FAIL")
          echo "  $domain -> GET $CODE (expect 401) | CORS header present: $ACAO (expect 1) | preflight $PRE (expect 204)"
        done

    - name: Verify the genuinely-bypassed paths still answer
      raw: |
        # calendar-api carries its own bearer token; calendar-agents is called
        # server-to-server by n8n and has no browser session to offer.
        echo "calendar-api:      $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://calendar-api.wbdigitalsolutions.com/ || echo 'DOWN') (expect 200/404)"
        echo "calendar-agents:   $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://calendar-agents.wbdigitalsolutions.com/health || echo 'DOWN') (expect 200)"
        echo "calendar-agents/docs: $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://calendar-agents.wbdigitalsolutions.com/docs || echo 'DOWN') (expect 404)"
      changed_when: false

    - name: Authelia setup summary
      raw: |
        echo "=========================================="
        echo "  Authelia Auth Gateway Setup Complete"
